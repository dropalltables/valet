# Publishes ghcr.io/<owner>/valet-core, valet-web and valet-sandbox for linux/amd64 and
# linux/arm64. Each platform builds on a runner of its own architecture (emulating arm64
# for the sandbox image, which compiles node-pty and installs a desktop, is far too slow),
# then one manifest list per image points at both digests.

name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  # The sandbox image installs the newest agent CLIs, so it is rebuilt daily.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Which images to build (only the sandbox on the daily run) and the CLI versions it gets.
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      claude_code: ${{ steps.plan.outputs.claude_code }}
      codex: ${{ steps.plan.outputs.codex }}
      agent_browser: ${{ steps.plan.outputs.agent_browser }}
    steps:
      - id: plan
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$SCHEDULED" = true ]; then echo 'images=["sandbox"]'; else echo 'images=["core","web","sandbox"]'; fi >> "$GITHUB_OUTPUT"
          echo "claude_code=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
          echo "codex=$(npm view @openai/codex version)" >> "$GITHUB_OUTPUT"
          echo "agent_browser=$(npm view agent-browser version)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - id: names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/valet-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image == 'sandbox' && 'sandbox/Dockerfile' || format('apps/{0}/Dockerfile', matrix.image) }}
          platforms: ${{ matrix.platform }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ needs.plan.outputs.claude_code }}
            CODEX_VERSION=${{ needs.plan.outputs.codex }}
            AGENT_BROWSER_VERSION=${{ needs.plan.outputs.agent_browser }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.names.outputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.names.outputs.platform }}

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ steps.names.outputs.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/valet-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
