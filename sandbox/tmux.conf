# The session is shared between the agent and the browser terminal; size follows the most recent client.
set -g window-size latest
set -g default-terminal "tmux-256color"
set -g history-limit 50000
# With mouse reporting on, xterm.js sends wheel events to tmux, which scrolls its own
# history. Without it, xterm.js turns wheel events in the alternate screen into arrow keys.
set -g mouse on
