; The whole supervisord configuration for the sandbox (installed over Debian's
; /etc/supervisor/supervisord.conf). All program output goes to the container log.
; Programs inherit the container environment (including the supervisor token from
; `docker run -e`) because supervisord itself is exec'd from the entrypoint without
; a login shell. supervisord cannot unset an inherited variable, so every program
; except [program:supervisor] gets the token overridden to empty. That keeps the
; token out of logs and env dumps; it is not isolation: every program runs as
; valet like the supervisor, and valet has sudo. The container is the trust boundary.

; The socket is group-writable for valet: the Node supervisor (user valet) writes
; service units to conf.d/services and applies them with `supervisorctl update`,
; and reads process state over the XML-RPC API on this socket.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:valet

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Log level 10 keeps errors and connection open/close; the default (30) adds
; six lines of encoder statistics per connection, and /health connects often.
; The blacklist counts every pre-auth disconnect against 127.0.0.1, which all
; /vnc relay clients share; with -localhost and SecurityTypes None it protects nothing.
[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1920x1080 -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -UseBlacklist 0 -desktop Valet -Log *:stderr:10
user=valet
environment=HOME="/home/valet",USER="valet",VALET_SUPERVISOR_TOKEN=""
priority=100
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One session bus for the desktop and for every shell the agent gets, at the address
; the image ENV advertises; xfce4-session would otherwise dbus-launch a private one.
[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/run/user/1000/bus
user=valet
environment=HOME="/home/valet",USER="valet",XDG_RUNTIME_DIR="/run/user/1000",VALET_SUPERVISOR_TOKEN=""
priority=150
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfce]
command=/usr/local/bin/valet-xfce
user=valet
environment=HOME="/home/valet",USER="valet",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",NO_AT_BRIDGE="1",VALET_SUPERVISOR_TOKEN=""
priority=200
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:supervisor]
command=/usr/local/bin/node /opt/valet/supervisor/index.js
user=valet
directory=/home/valet
priority=300
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Managed services (`valet service start`, .valet/services.yaml): one svc-<name>.conf
; each, generated by the Node supervisor from /home/valet/.valet/services.json.
[include]
files = /etc/supervisor/conf.d/*.conf /etc/supervisor/conf.d/services/*.conf
