; Included by Debian's /etc/supervisor/supervisord.conf. All output goes to the
; container log. Programs inherit the container environment (including the
; supervisor token from `docker run -e`) because supervisord itself is exec'd
; from the entrypoint without a login shell. supervisord cannot unset an
; inherited variable, so the desktop programs get the token overridden to empty:
; only [program:supervisor] may see it.

; Log level 10 keeps errors and connection open/close; the default (30) adds
; six lines of encoder statistics per connection, and /health connects often.
; The blacklist counts every pre-auth disconnect against 127.0.0.1, which all
; /vnc relay clients share; with -localhost and SecurityTypes None it protects nothing.
[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1920x1080 -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -UseBlacklist 0 -desktop Valet -Log *:stderr:10
user=valet
environment=HOME="/home/valet",USER="valet",VALET_SUPERVISOR_TOKEN=""
priority=100
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfce]
command=/usr/local/bin/valet-xfce
user=valet
environment=HOME="/home/valet",USER="valet",DISPLAY=":1",XDG_RUNTIME_DIR="/run/user/1000",NO_AT_BRIDGE="1",VALET_SUPERVISOR_TOKEN=""
priority=200
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:supervisor]
command=/usr/local/bin/node /opt/valet/supervisor/index.js
user=valet
directory=/home/valet
priority=300
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
