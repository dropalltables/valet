# Valet: self-hosted cloud coding agents. One compose file is the whole install.
#
# Services
#   db       Postgres 17
#   core     API, orchestrator, and event log. Creates one sandbox container per
#            thread through the Docker socket, so it needs /var/run/docker.sock.
#   web      Next.js UI. Proxies /api and service hosts (t-<thread>-p<port>.*) to core;
#            publishes the only host port.
#   sandbox  Build-only (profile `sandbox`): the image every thread runs in.
#            `docker compose --profile sandbox build` produces valet-sandbox:latest.
#            Core also pulls this image itself when it is missing.
#
# Images are built here by default. Set VALET_IMAGE_PREFIX (e.g. ghcr.io/your-org/) to
# name published images instead, and add -f docker-compose.prebuilt.yaml to skip building.
#
# Core discovers the Docker network and the repos volume by inspecting its own container,
# because the compose project name (and so their prefix) belongs to whoever deploys this.
#
# The Docker socket grants core root-equivalent access to this host. That is the
# price of creating and stopping containers on demand; do not expose core itself.

name: valet

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: valet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: valet
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valet -d valet"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [valet]

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    image: ${VALET_IMAGE_PREFIX:-}valet-core:latest
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      DATABASE_URL: postgres://valet:${POSTGRES_PASSWORD}@db:5432/valet
      VALET_SECRET_KEY: ${VALET_SECRET_KEY:?set VALET_SECRET_KEY in .env (32 random bytes, base64)}
      VALET_PASSWORD: ${VALET_PASSWORD:-}
      VALET_BASE_URL: ${VALET_BASE_URL:-http://localhost:3000}
      VALET_SERVICE_DOMAIN: ${VALET_SERVICE_DOMAIN:-}
      VALET_SANDBOX_IMAGE: ${VALET_SANDBOX_IMAGE:-${VALET_IMAGE_PREFIX:-}valet-sandbox:latest}
      VALET_DOCKER_NETWORK: ${VALET_DOCKER_NETWORK:-}
      VALET_REPOS_VOLUME: ${VALET_REPOS_VOLUME:-}
      VALET_IDLE_PAUSE_MINUTES: ${VALET_IDLE_PAUSE_MINUTES:-10}
      VALET_SANDBOX_MEMORY: ${VALET_SANDBOX_MEMORY:-4g}
      VALET_SANDBOX_CPUS: ${VALET_SANDBOX_CPUS:-2}
      VALET_SANDBOX_PIDS: ${VALET_SANDBOX_PIDS:-2048}
      VALET_MAX_RUNNING_SANDBOXES: ${VALET_MAX_RUNNING_SANDBOXES:-8}
      VALET_SNAPSHOTS: ${VALET_SNAPSHOTS:-1}
      VALET_SNAPSHOT_MAX_GB: ${VALET_SNAPSHOT_MAX_GB:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos:/valet/repos
    depends_on:
      db:
        condition: service_healthy
    networks: [valet]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${VALET_IMAGE_PREFIX:-}valet-web:latest
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      VALET_CORE_URL: http://core:8080
      VALET_SECRET_KEY: ${VALET_SECRET_KEY}
      VALET_PASSWORD: ${VALET_PASSWORD:-}
      VALET_BASE_URL: ${VALET_BASE_URL:-http://localhost:3000}
      VALET_SERVICE_DOMAIN: ${VALET_SERVICE_DOMAIN:-}
    ports:
      - "${VALET_BIND:-127.0.0.1}:${VALET_PORT:-3000}:3000"
    # Services are wildcard subdomains, which Coolify's domain field cannot express, so the
    # router is declared here. Leave the domain field empty or two routers claim the host.
    # Coolify escapes `$` in labels unless "Escape special characters in labels" is off;
    # these need it off. The dots in VALET_SERVICE_DOMAIN are unescaped in the regexp,
    # which only hosts whose DNS points here ever reach, so nothing more matches.
    labels:
      - traefik.enable=true
      - traefik.http.routers.valet.rule=Host(`${VALET_SERVICE_DOMAIN}`) || HostRegexp(`^t-[^.]+\.${VALET_SERVICE_DOMAIN}$$`)
      - traefik.http.routers.valet.entrypoints=https
      - traefik.http.routers.valet.tls=true
      - traefik.http.routers.valet.tls.certresolver=${VALET_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.valet.tls.domains[0].main=${VALET_SERVICE_DOMAIN}
      - traefik.http.routers.valet.tls.domains[0].sans=*.${VALET_SERVICE_DOMAIN}
      - traefik.http.services.valet.loadbalancer.server.port=3000
      # web sits on more than one network when the proxy brings its own; Traefik needs
      # telling which one it shares, or it picks one at random. Empty means unset.
      - traefik.docker.network=${VALET_PROXY_NETWORK:-}
    depends_on:
      core:
        condition: service_started
    networks: [valet]

  # Build-only. Never started by `docker compose up`.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: ${VALET_SANDBOX_IMAGE:-${VALET_IMAGE_PREFIX:-}valet-sandbox:latest}
    profiles: [sandbox]
    command: ["true"]

networks:
  valet:
    driver: bridge

volumes:
  db-data:
  # Bare git repositories for blank projects; mounted into core and every sandbox.
  repos:
